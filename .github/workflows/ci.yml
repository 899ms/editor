name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/gln-editor]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format check
        run: bun run check

      - name: i18n checks
        run: bun run check:i18n

      - name: Type check
        run: bun run check-types

      - name: GLN application tests
        run: bun run --cwd apps/gln-editor test

      - name: GLN plugin tests
        run: bun run --cwd packages/plugin-gln test

  gln-e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run GLN application acceptance
        run: bun run prepare:e2e:gln && bunx playwright test --config apps/gln-editor/playwright.config.ts --shard=${{ matrix.shard }}/4

      - name: Upload GLN acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gln-acceptance-artifacts-${{ matrix.shard }}
          path: |
            apps/gln-editor/playwright-report
            apps/gln-editor/test-results
          if-no-files-found: ignore
